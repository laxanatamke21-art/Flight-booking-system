<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Flights - SkyBook</title>

    <style>

        * {
            box-sizing: border-box;
        }

        /* =====================================================
           FULL PAGE BACKGROUND
        ===================================================== */

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            color: #172033;

            background-image:
                linear-gradient(
                    rgba(4, 35, 75, 0.48),
                    rgba(4, 35, 75, 0.48)
                ),
                url("/static/image/flight-bg.jpeg");

            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            min-height: 100vh;
        }


        /* =====================================================
           NAVBAR
        ===================================================== */

        .navbar {
            height: 78px;

            background: #2563eb;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 7%;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.20);

            position: sticky;

            top: 0;

            z-index: 1000;
        }


        .logo {
            font-size: 28px;

            font-weight: bold;

            color: white;
        }


        .nav-links {
            display: flex;

            align-items: center;

            gap: 12px;
        }


        .nav-links a {
            text-decoration: none;

            background: white;

            color: #2563eb;

            font-weight: bold;

            padding: 10px 20px;

            border-radius: 9px;

            transition: 0.3s;
        }


        .nav-links a:hover {
            background: #e0f2fe;

            color: #1d4ed8;

            transform: translateY(-2px);

            box-shadow:
                0 5px 12px
                rgba(0, 0, 0, 0.18);
        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {
            min-height: 330px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 50px 20px 100px;

            color: white;

            position: relative;

            z-index: 1;
        }


        .hero h1 {
            font-size: 44px;

            margin: 0 0 12px;

            color: white;

            text-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.55);
        }


        .hero p {
            font-size: 18px;

            margin: 0;

            max-width: 700px;

            line-height: 1.6;

            color: white;

            text-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.50);
        }


        /* =====================================================
           SEARCH BOX
        ===================================================== */

        .search-box {
            max-width: 1130px;

            margin:
                -75px auto 35px;

            background:
                rgba(255, 255, 255, 0.97);

            padding: 28px;

            border-radius: 22px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.22);

            position: relative;

            z-index: 10;
        }


        /* =====================================================
           TRIP TYPE
        ===================================================== */

        .trip-type {
            display: flex;

            justify-content: center;

            gap: 12px;

            margin-bottom: 25px;
        }


        .trip-btn {
            border: 2px solid #2563eb;

            background: #2563eb;

            color: white;

            padding: 11px 32px;

            border-radius: 30px;

            font-size: 15px;

            font-weight: bold;

            cursor: default;

            box-shadow:
                0 5px 15px
                rgba(37, 99, 235, 0.25);
        }


        /* =====================================================
           SEARCH GRID
        ===================================================== */

        .search-grid {
            display: grid;

            grid-template-columns:
                1fr
                1fr
                1fr
                auto;

            gap: 14px;

            align-items: end;
        }


        .field label {
            display: block;

            font-weight: bold;

            margin-bottom: 8px;

            color: #344054;
        }


        .field input {
            width: 100%;

            padding: 14px;

            border-radius: 10px;

            border: 1px solid #d0d5dd;

            font-size: 15px;

            outline: none;

            background: white;

            transition: 0.2s;
        }


        .field input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);
        }


        /* =====================================================
           SEARCH BUTTON
        ===================================================== */

        .search-btn {
            border: none;

            border-radius: 10px;

            padding: 14px 28px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            min-height: 49px;
        }


        .search-btn:hover {
            background: #1d4ed8;

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(37, 99, 235, 0.35);
        }


        /* =====================================================
           FILTER AREA
        ===================================================== */

        .filters {
            max-width: 1130px;

            margin:
                0 auto 18px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;
        }


        #resultCount {
            font-weight: bold;

            color: white;

            font-size: 16px;

            text-shadow:
                0 2px 5px
                rgba(0, 0, 0, 0.65);
        }


        .filters select {
            padding: 11px 15px;

            border-radius: 9px;

            border: 1px solid #d0d5dd;

            background: white;

            font-size: 14px;

            cursor: pointer;
        }


        /* =====================================================
           RESULTS
        ===================================================== */

        #flightResults {
            max-width: 1130px;

            margin: auto;

            padding-bottom: 60px;
        }


        /* =====================================================
           SECTION TITLE
        ===================================================== */

        .result-section-title {
            color: white;

            font-size: 21px;

            font-weight: bold;

            margin:
                20px 0 15px;

            text-shadow:
                0 2px 6px
                rgba(0, 0, 0, 0.60);
        }


        /* =====================================================
           FLIGHT CARD
        ===================================================== */

        .flight-card {
            background:
                rgba(255, 255, 255, 0.97);

            margin-bottom: 18px;

            padding: 25px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.16);

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }


        .flight-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 18px 40px
                rgba(0, 0, 0, 0.22);
        }


        .flight-top {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;
        }


        .airline {
            font-size: 21px;

            font-weight: bold;

            color: #2563eb;
        }


        .flight-number {
            color: #667085;

            margin-top: 4px;
        }


        .flight-date {
            background: #eff6ff;

            color: #2563eb;

            padding: 8px 12px;

            border-radius: 8px;

            font-weight: bold;
        }


        /* =====================================================
           ROUTE
        ===================================================== */

        .route {
            display: grid;

            grid-template-columns:
                1fr
                auto
                1fr;

            align-items: center;

            gap: 20px;

            margin: 25px 0;
        }


        .time {
            font-size: 27px;

            font-weight: bold;
        }


        .city {
            color: #667085;

            margin-top: 5px;
        }


        .arrow {
            font-size: 25px;

            color: #2563eb;
        }


        /* =====================================================
           BOTTOM
        ===================================================== */

        .flight-bottom {
            display: flex;

            justify-content: space-between;

            align-items: center;

            border-top:
                1px solid #eeeeee;

            padding-top: 18px;

            gap: 20px;
        }


        .price {
            font-size: 24px;

            font-weight: bold;

            color: #172033;
        }


        .price-label {
            color: #667085;

            font-size: 13px;

            margin-bottom: 3px;
        }


        .seats {
            color: #16a34a;

            font-weight: bold;

            margin-top: 5px;
        }


        /* =====================================================
           BOOK BUTTON
        ===================================================== */

        .book-btn {
            border: none;

            padding: 13px 25px;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-weight: bold;

            cursor: pointer;

            font-size: 15px;

            transition: 0.3s;
        }


        .book-btn:hover {
            background: #1d4ed8;

            transform: translateY(-2px);

            box-shadow:
                0 7px 18px
                rgba(37, 99, 235, 0.30);
        }


        /* =====================================================
           EMPTY
        ===================================================== */

        .empty {
            background:
                rgba(255, 255, 255, 0.97);

            padding: 55px 30px;

            text-align: center;

            border-radius: 18px;

            color: #667085;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.16);
        }


        .empty-icon {
            font-size: 45px;

            margin-bottom: 10px;
        }


        .empty h2 {
            color: #172033;

            margin-bottom: 8px;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {
            background:
                rgba(255, 255, 255, 0.97);

            text-align: center;

            padding: 50px;

            font-size: 20px;

            border-radius: 18px;

            color: #2563eb;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.16);
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media(max-width: 1000px) {

            .search-grid {
                grid-template-columns:
                    1fr
                    1fr;
            }

            .search-btn {
                width: 100%;
            }
        }


        @media(max-width: 800px) {

            .navbar {
                padding: 0 20px;

                height: auto;

                min-height: 70px;

                flex-direction: column;

                gap: 10px;

                padding-top: 12px;

                padding-bottom: 12px;
            }


            .nav-links {
                gap: 5px;

                flex-wrap: wrap;

                justify-content: center;
            }


            .nav-links a {
                padding: 8px 12px;

                font-size: 14px;
            }


            .hero {
                min-height: 300px;

                padding: 45px 20px 90px;
            }


            .hero h1 {
                font-size: 32px;
            }


            .hero p {
                font-size: 16px;
            }


            .search-box {
                margin:
                    -55px 15px 30px;

                padding: 22px;
            }


            .search-grid {
                grid-template-columns: 1fr;
            }


            .trip-type {
                flex-wrap: wrap;
            }


            .filters {
                margin:
                    0 15px 18px;

                flex-direction: column;

                align-items: stretch;
            }


            .filters select {
                width: 100%;
            }


            #flightResults {
                margin: 0 15px;
            }


            .flight-top {
                flex-direction: column;

                align-items: flex-start;
            }


            .route {
                gap: 10px;
            }


            .time {
                font-size: 22px;
            }


            .flight-bottom {
                flex-direction: column;

                align-items: stretch;
            }


            .book-btn {
                width: 100%;
            }
        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar">

    <div class="logo">
        ✈️ SkyBook
    </div>

    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="flights.html">
            Flights
        </a>

        <a href="login.html">
            Login
        </a>

    </div>

</nav>


<!-- =====================================================
     HERO
===================================================== -->

<section class="hero">

    <h1>
        Find Your Perfect Flight ✈️
    </h1>

    <p>
        Search one-way flights by departure city,
        destination and travel date.
    </p>

</section>


<!-- =====================================================
     SEARCH BOX
===================================================== -->

<div class="search-box">


    <div class="search-grid">


        <!-- FROM -->

        <div class="field">

            <label for="source">
                From
            </label>

            <input
                id="source"
                list="cities"
                placeholder="e.g. Mumbai"
                autocomplete="off"
            >

        </div>


        <!-- TO -->

        <div class="field">

            <label for="destination">
                To
            </label>

            <input
                id="destination"
                list="cities"
                placeholder="e.g. Delhi"
                autocomplete="off"
            >

        </div>


        <!-- DEPARTURE DATE -->

        <div class="field">

            <label for="travelDate">
                Departure Date
            </label>

            <input
                type="date"
                id="travelDate"
            >

        </div>


        <!-- SEARCH -->

        <button
            class="search-btn"
            onclick="searchFlights()">

            🔎 Search

        </button>

    </div>


    <!-- CITY DATA -->

    <datalist id="cities">

        <option value="Mumbai">
        <option value="Delhi">
        <option value="Bangalore">
        <option value="Hyderabad">
        <option value="Chennai">
        <option value="Kolkata">
        <option value="Pune">
        <option value="Goa">

    </datalist>

</div>


<!-- =====================================================
     FILTER
===================================================== -->

<div class="filters">

    <div id="resultCount">
        Search for flights
    </div>


    <select
        id="sort"
        onchange="sortFlights()">

        <option value="departure">
            Sort by Departure
        </option>

        <option value="priceLow">
            Price: Low to High
        </option>

        <option value="priceHigh">
            Price: High to Low
        </option>

        <option value="airline">
            Airline
        </option>

    </select>

</div>


<!-- =====================================================
     RESULTS
===================================================== -->

<div id="flightResults">

    <div class="empty">

        <div class="empty-icon">
            ✈️
        </div>

        <h2>
            Search for your flight
        </h2>

        <p>
            Select From, To and Travel Date.
        </p>

    </div>

</div>


<script>


/* =====================================================
   FLIGHT SERVICE
===================================================== */

const API =
    "http://localhost:5001";


let currentFlights = [];


/* =====================================================
   SET DATE LIMITS
===================================================== */

function setupDatePicker() {

    const travelDate =
        document.getElementById(
            "travelDate"
        );


    const today =
        new Date();


    const todayString =
        today.toISOString()
            .split("T")[0];


    travelDate.min =
        todayString;


    travelDate.max =
        "2027-10-31";


    travelDate.value =
        todayString;
}


/* =====================================================
   SEARCH FLIGHTS
===================================================== */

async function searchFlights() {


    const source =
        document
        .getElementById("source")
        .value
        .trim();


    const destination =
        document
        .getElementById("destination")
        .value
        .trim();


    const date =
        document
        .getElementById("travelDate")
        .value;


    /* -------------------------
       VALIDATION
    ------------------------- */

    if (!source) {

        alert(
            "Please enter departure city."
        );

        return;
    }


    if (!destination) {

        alert(
            "Please enter destination city."
        );

        return;
    }


    if (!date) {

        alert(
            "Please select departure date."
        );

        return;
    }


    const results =
        document.getElementById(
            "flightResults"
        );


    results.innerHTML = `

        <div class="loading">

            ✈️ Searching available flights...

        </div>

    `;


    try {


        /* =================================================
           ONE-WAY FLIGHT SEARCH
        ================================================= */

        const searchUrl =
            `${API}/flights/search` +
            `?source=${encodeURIComponent(source)}` +
            `&destination=${encodeURIComponent(destination)}` +
            `&date=${date}`;


        console.log(
            "Flight Search:",
            searchUrl
        );


        const response =
            await fetch(
                searchUrl
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                result.error ||
                "Flight search failed"
            );

        }


        currentFlights =
            result.flights || [];


        renderFlights();

    }


    catch(error) {

        console.error(
            "Flight Search Error:",
            error
        );


        results.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ❌
                </div>

                <h2>
                    Unable to search flights
                </h2>

                <p>
                    ${error.message}
                </p>

                <p>
                    Make sure Flight Service
                    is running on port 5001.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   RENDER FLIGHTS
===================================================== */

function renderFlights() {


    const results =
        document.getElementById(
            "flightResults"
        );


    const count =
        document.getElementById(
            "resultCount"
        );


    count.innerHTML =
        `${currentFlights.length} flight(s) found`;


    if (
        currentFlights.length === 0
    ) {

        results.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    😔
                </div>

                <h2>
                    No flights available
                </h2>

                <p>
                    Try another date,
                    route or airline.
                </p>

            </div>

        `;

        return;
    }


    results.innerHTML =
        currentFlights
        .map(
            flight =>
                createFlightCard(
                    flight
                )
        )
        .join("");

}


/* =====================================================
   CREATE FLIGHT CARD
===================================================== */

function createFlightCard(
    flight
) {


    return `

        <div class="flight-card">


            <div class="flight-top">


                <div>

                    <div class="airline">

                        ✈️
                        ${flight.airline}

                    </div>


                    <div class="flight-number">

                        Flight:
                        ${flight.flight_number}

                    </div>

                </div>


                <div class="flight-date">

                    📅
                    ${flight.date}

                </div>

            </div>


            <div class="route">


                <div>

                    <div class="time">

                        ${flight.departure_time}

                    </div>


                    <div class="city">

                        ${flight.source}

                    </div>

                </div>


                <div class="arrow">

                    ✈️ →

                </div>


                <div>

                    <div class="time">

                        ${flight.arrival_time}

                    </div>


                    <div class="city">

                        ${flight.destination}

                    </div>

                </div>

            </div>


            <div class="flight-bottom">


                <div>

                    <div class="price-label">

                        Starting from

                    </div>


                    <div class="price">

                        ₹${Number(
                            flight.price
                        ).toLocaleString(
                            "en-IN"
                        )}

                    </div>


                    <div class="seats">

                        🟢
                        ${flight.available_seats}
                        seats available

                    </div>

                </div>


                <button
                    class="book-btn"
                    onclick="bookFlight(${flight.id})">

                    Select Flight →

                </button>

            </div>

        </div>

    `;

}


/* =====================================================
   SORT FLIGHTS
===================================================== */

function sortFlights() {


    const sort =
        document.getElementById(
            "sort"
        ).value;


    if (
        sort === "priceLow"
    ) {

        currentFlights.sort(
            (a, b) =>
                Number(a.price) -
                Number(b.price)
        );

    }


    else if (
        sort === "priceHigh"
    ) {

        currentFlights.sort(
            (a, b) =>
                Number(b.price) -
                Number(a.price)
        );

    }


    else if (
        sort === "airline"
    ) {

        currentFlights.sort(
            (a, b) =>
                String(
                    a.airline
                ).localeCompare(
                    String(
                        b.airline
                    )
                )
        );

    }


    else {

        currentFlights.sort(
            (a, b) =>
                String(
                    a.departure_time
                ).localeCompare(
                    String(
                        b.departure_time
                    )
                )
        );

    }


    renderFlights();

}


/* =====================================================
   SELECT FLIGHT
===================================================== */

function bookFlight(
    flightId
) {


    /* Save selected flight */

    localStorage.setItem(
        "flightId",
        flightId
    );


    /* Make sure old return-flight
       data is removed */

    localStorage.removeItem(
        "returnFlightId"
    );


    /* Store one-way trip */

    localStorage.setItem(
        "tripType",
        "oneway"
    );


    /* Clear old booking data */

    localStorage.removeItem(
        "selectedSeats"
    );

    localStorage.removeItem(
        "passengers"
    );

    localStorage.removeItem(
        "passengerBaggage"
    );

    localStorage.removeItem(
        "paymentInfo"
    );

    localStorage.removeItem(
        "paymentId"
    );

    localStorage.removeItem(
        "transactionId"
    );


    console.log(
        "Selected Flight:",
        flightId
    );


    /* Go to seat selection */

    window.location.href =
        "seats.html";

}


/* =====================================================
   START
===================================================== */

setupDatePicker();


</script>


</body>

</html>
